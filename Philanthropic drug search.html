<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philanthropic Drug Search</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2127;
    --border: #2a2d35;
    --border2: #363a45;
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #4f9ef8;
    --accent-dim: #1a3a5c;
    --green: #34d399;
    --green-dim: #0d3326;
    --red: #f87171;
    --red-dim: #3b1515;
    --amber: #fbbf24;
    --radius: 8px;
    --font: 'Sora', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* LAYOUT */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.3px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .status-pill {
    font-size: 11px;
    font-family: var(--mono);
    padding: 3px 8px;
    border-radius: 99px;
    border: 1px solid var(--border2);
    color: var(--muted);
    background: var(--surface2);
  }
  .status-pill.connected { border-color: #1a5c3a; color: var(--green); background: var(--green-dim); }
  .status-pill.error { border-color: #5c1a1a; color: var(--red); background: var(--red-dim); }

  .spacer { flex: 1; }

  .btn {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--border); border-color: var(--border2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .main { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 14px 16px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .table-list { overflow-y: auto; flex: 1; padding: 6px; }

  .table-item {
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12.5px;
    transition: all 0.1s;
  }
  .table-item:hover { background: var(--surface2); color: var(--text); }
  .table-item.active { background: var(--accent-dim); color: var(--accent); }

  .table-icon { font-size: 10px; opacity: 0.6; }

  /* CONTENT AREA */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  input[type="text"], select {
    font-family: var(--font);
    font-size: 13px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: var(--radius);
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  .search-wrap input { padding-left: 30px; width: 100%; }

  select { cursor: pointer; }
  select option { background: var(--surface2); }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-label { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .row-count {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    white-space: nowrap;
    margin-left: auto;
  }

  /* TABLE */
  .table-wrap {
    flex: 1;
    overflow: auto;
    padding: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
  }

  th {
    padding: 10px 16px;
    text-align: left;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }
  th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }

  th .sort-arrow { margin-left: 4px; opacity: 0.6; font-size: 10px; }

  td {
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 12.5px;
    color: #c0c5d0;
  }

  tr:hover td { background: var(--surface2); }

  td.null-val { color: var(--border2); font-style: italic; }
  td.bool-true { color: var(--green); }
  td.bool-false { color: var(--red); }
  td.number-val { color: #93c5fd; }

  /* EMPTY / LOADING STATES */
  .state-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .state-box .icon { font-size: 36px; opacity: 0.4; }
  .state-box h3 { font-size: 16px; font-weight: 500; color: var(--text); }
  .state-box p { font-size: 13px; max-width: 340px; line-height: 1.6; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .page-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.1s;
  }
  .page-btn:hover { background: var(--border); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-family: var(--mono); font-size: 11px; }

  /* CONFIG MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 28px;
    width: 480px;
    max-width: 95vw;
  }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .form-group input { width: 100%; font-family: var(--mono); font-size: 12.5px; }

  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h2>Connect to Supabase</h2>
    <p>Enter your project URL and anon key. These will be saved in your browser for future sessions.</p>
    <div class="form-group">
      <label>Project URL</label>
      <input type="text" id="cfgUrl" placeholder="https://xyzxyz.supabase.co" />
    </div>
    <div class="form-group">
      <label>Anon / Public Key</label>
      <input type="text" id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
    </div>
    <div id="cfgError" style="color:var(--red);font-size:12px;margin-top:8px;display:none;"></div>
    <div class="modal-footer">
      <button class="btn primary" id="cfgConnect">Connect</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="appShell" style="display:none;">
  <div class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      Philanthropic Drug Search
    </div>
    <div class="status-pill connected" id="connStatus">● connected</div>
    <span class="spacer"></span>
    <button class="btn" id="refreshTablesBtn" title="Refresh table list">⟳ Refresh</button>
    <button class="btn" id="editConnBtn">⚙ Settings</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        Tables
        <span id="tableCount" style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;">—</span>
      </div>
      <div class="table-list" id="tableList">
        <div class="state-box" style="padding:24px 12px;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="content" id="contentArea">
      <div class="state-box">
        <div class="icon">⬡</div>
        <h3>Select a table</h3>
        <p>Choose a table from the left panel to start exploring your data.</p>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// You can pre-fill these so users don't see the setup modal:
const PRESET_URL = 'https://klclpcseervjblndmsmz.supabase.co';
const PRESET_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsY2xwY3NlZXJ2amJsbmRtc216Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDY2MTgsImV4cCI6MjA5MzU4MjYxOH0.clFAewJRFx4pjFLYMlhPO5d4svv-tawHH-HYaORx0xU';
// ─────────────────────────────────────────────────────────────────────────────

let supabaseUrl = '';
let supabaseKey = '';
let currentTable = null;
let allColumns = [];
let allRows = [];
let filteredRows = [];
let sortCol = null;
let sortDir = 'asc';
let searchQuery = '';
let filterCol = 'all';
let pageSize = 50;
let currentPage = 1;

const LS_URL = 'sbe_url';
const LS_KEY = 'sbe_key';

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const savedUrl = localStorage.getItem(LS_URL) || PRESET_URL;
  const savedKey = localStorage.getItem(LS_KEY) || PRESET_KEY;

  if (savedUrl && savedKey) {
    supabaseUrl = savedUrl;
    supabaseKey = savedKey;
    launchApp();
  } else {
    document.getElementById('configModal').style.display = 'flex';
    document.getElementById('cfgUrl').focus();
  }

  document.getElementById('cfgConnect').addEventListener('click', handleConnect);
  document.getElementById('editConnBtn').addEventListener('click', () => {
    document.getElementById('cfgUrl').value = supabaseUrl;
    document.getElementById('cfgKey').value = supabaseKey;
    document.getElementById('configModal').style.display = 'flex';
  });
  document.getElementById('refreshTablesBtn').addEventListener('click', loadTables);
});

async function handleConnect() {
  const url = document.getElementById('cfgUrl').value.trim().replace(/\/$/, '');
  const key = document.getElementById('cfgKey').value.trim();
  const errEl = document.getElementById('cfgError');
  errEl.style.display = 'none';

  if (!url || !key) { showCfgErr('Both fields are required.'); return; }

  const btn = document.getElementById('cfgConnect');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Connecting…';

  try {
    const res = await sbFetch(`${url}/rest/v1/`, key);
    if (!res.ok && res.status !== 200) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0, 120)}`);
    }
    supabaseUrl = url;
    supabaseKey = key;
    localStorage.setItem(LS_URL, url);
    localStorage.setItem(LS_KEY, key);
    document.getElementById('configModal').style.display = 'none';
    launchApp();
  } catch (e) {
    showCfgErr('Could not connect: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Connect';
  }
}

function showCfgErr(msg) {
  const el = document.getElementById('cfgError');
  el.textContent = msg;
  el.style.display = 'block';
}

function launchApp() {
  document.getElementById('appShell').style.display = 'flex';
  loadTables();
}

// ─── FETCH HELPERS ────────────────────────────────────────────────────────────
function sbFetch(url, key, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: {
      'apikey': key || supabaseKey,
      'Authorization': 'Bearer ' + (key || supabaseKey),
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
}

// ─── TABLES ───────────────────────────────────────────────────────────────────
async function loadTables() {
  const list = document.getElementById('tableList');
  list.innerHTML = `<div class="state-box" style="padding:24px 12px;"><div class="spinner"></div></div>`;
  document.getElementById('tableCount').textContent = '—';

  try {
    // Use PostgREST OpenAPI spec to discover tables
    const res = await sbFetch(`${supabaseUrl}/rest/v1/`, supabaseKey);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const spec = await res.json();

    const tables = Object.keys(spec.definitions || {}).sort();
    document.getElementById('tableCount').textContent = tables.length;

    if (tables.length === 0) {
      list.innerHTML = `<div class="state-box" style="padding:24px 12px;"><p style="font-size:12px;">No tables found. Check RLS policies.</p></div>`;
      return;
    }

    list.innerHTML = '';
    tables.forEach(name => {
      const el = document.createElement('div');
      el.className = 'table-item' + (name === currentTable ? ' active' : '');
      el.innerHTML = `<span class="table-icon">▤</span>${name}`;
      el.addEventListener('click', () => selectTable(name));
      list.appendChild(el);
    });
  } catch (e) {
    list.innerHTML = `<div class="state-box" style="padding:16px;"><p style="font-size:12px;color:var(--red);">Failed to load tables: ${e.message}</p></div>`;
  }
}

// ─── SELECT TABLE ─────────────────────────────────────────────────────────────
async function selectTable(name) {
  currentTable = name;
  sortCol = null; sortDir = 'asc';
  searchQuery = ''; filterCol = 'all';
  currentPage = 1;

  // Highlight active
  document.querySelectorAll('.table-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === name);
  });

  renderLoadingContent(name);

  try {
    // Fetch up to 2000 rows (read-only, no count overhead)
    const res = await sbFetch(
      `${supabaseUrl}/rest/v1/${encodeURIComponent(name)}?limit=2000`,
      supabaseKey,
      { headers: { 'Prefer': 'return=representation' } }
    );

    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
    }

    const data = await res.json();
    allRows = data;
    allColumns = data.length > 0 ? Object.keys(data[0]) : [];
    applyFilters();
    renderTableView(name);
  } catch (e) {
    renderError(name, e.message);
  }
}

// ─── FILTER / SORT ───────────────────────────────────────────────────────────
function applyFilters() {
  const q = searchQuery.toLowerCase().trim();

  // Show nothing until the user types a search query
  if (!q) {
    filteredRows = [];
    currentPage = 1;
    return;
  }

  let rows = [...allRows].filter(row => {
    if (filterCol !== 'all') {
      const val = row[filterCol];
      return String(val ?? '').toLowerCase().includes(q);
    }
    return allColumns.some(col => String(row[col] ?? '').toLowerCase().includes(q));
  });

  if (sortCol) {
    rows.sort((a, b) => {
      const av = a[sortCol], bv = b[sortCol];
      if (av === null) return 1;
      if (bv === null) return -1;
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }

  filteredRows = rows;
  currentPage = 1;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderLoadingContent(name) {
  const ca = document.getElementById('contentArea');
  ca.innerHTML = `
    <div class="toolbar">
      <span style="font-size:13px;font-weight:500;color:var(--text);font-family:var(--mono);">${name}</span>
    </div>
    <div class="state-box"><div class="spinner"></div><p>Loading rows…</p></div>
  `;
}

function renderError(name, msg) {
  const ca = document.getElementById('contentArea');
  ca.innerHTML = `
    <div class="toolbar">
      <span style="font-size:13px;font-weight:500;color:var(--text);font-family:var(--mono);">${name}</span>
    </div>
    <div class="state-box">
      <div class="icon">⚠</div>
      <h3>Failed to load</h3>
      <p style="color:var(--red);">${escHtml(msg)}</p>
      <p>Check that RLS allows SELECT, or that the table name is correct.</p>
    </div>
  `;
}

function renderTableView(name) {
  const ca = document.getElementById('contentArea');

  ca.innerHTML = `
    <div class="toolbar" id="toolbar">
      <span style="font-size:13px;font-weight:500;font-family:var(--mono);color:var(--text);flex-shrink:0;">${name}</span>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search…" value="${escHtml(searchQuery)}" />
      </div>
      <div class="filter-group">
        <span class="filter-label">in</span>
        <select id="filterColSelect">
          <option value="all">all columns</option>
          ${allColumns.map(c => `<option value="${escHtml(c)}" ${filterCol===c?'selected':''}>${escHtml(c)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">rows</span>
        <select id="pageSizeSelect">
          <option value="25" ${pageSize===25?'selected':''}>25</option>
          <option value="50" ${pageSize===50?'selected':''}>50</option>
          <option value="100" ${pageSize===100?'selected':''}>100</option>
          <option value="250" ${pageSize===250?'selected':''}>250</option>
        </select>
      </div>
      <span class="row-count" id="rowCount"></span>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
    <div class="pagination" id="paginationBar"></div>
  `;

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    applyFilters();
    renderGrid();
  });
  document.getElementById('filterColSelect').addEventListener('change', e => {
    filterCol = e.target.value;
    applyFilters();
    renderGrid();
  });
  document.getElementById('pageSizeSelect').addEventListener('change', e => {
    pageSize = parseInt(e.target.value);
    currentPage = 1;
    renderGrid();
  });

  renderGrid();
}

function renderGrid() {
  const wrap = document.getElementById('tableWrap');
  const pagination = document.getElementById('paginationBar');
  const rowCount = document.getElementById('rowCount');
  if (!wrap) return;

  const total = filteredRows.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  currentPage = Math.min(currentPage, totalPages);

  const start = (currentPage - 1) * pageSize;
  const pageRows = filteredRows.slice(start, start + pageSize);

  // No search typed yet — show prompt
  if (!searchQuery.trim()) {
    rowCount.textContent = `${allRows.length.toLocaleString()} total row${allRows.length !== 1 ? 's' : ''}`;
    wrap.innerHTML = `<div class="state-box"><div class="icon">⌕</div><h3>Type to search</h3><p>Enter a search term above to see matching rows from this table.</p></div>`;
    pagination.innerHTML = '';
    return;
  }

  rowCount.textContent = `${total.toLocaleString()} match${total !== 1 ? 'es' : ''}`;

  if (allColumns.length === 0) {
    wrap.innerHTML = `<div class="state-box"><div class="icon">◌</div><h3>Empty table</h3><p>This table has no rows.</p></div>`;
    pagination.innerHTML = '';
    return;
  }

  if (total === 0) {
    wrap.innerHTML = `<div class="state-box"><div class="icon">◌</div><h3>No matches</h3><p>No rows matched "<strong>${escHtml(searchQuery)}</strong>". Try a different term.</p></div>`;
    pagination.innerHTML = '';
    return;
  }

  // Table
  const thead = allColumns.map(col => {
    const sorted = sortCol === col;
    const arrow = sorted ? (sortDir === 'asc' ? '▲' : '▼') : '';
    return `<th class="${sorted ? 'sorted' : ''}" data-col="${escHtml(col)}">${escHtml(col)}${arrow ? `<span class="sort-arrow">${arrow}</span>` : ''}</th>`;
  }).join('');

  const tbody = pageRows.map(row => {
    const cells = allColumns.map(col => {
      const val = row[col];
      if (val === null || val === undefined) return `<td class="null-val">null</td>`;
      if (typeof val === 'boolean') return `<td class="${val ? 'bool-true' : 'bool-false'}">${val}</td>`;
      if (typeof val === 'number') return `<td class="number-val">${val}</td>`;
      if (typeof val === 'object') return `<td title="${escHtml(JSON.stringify(val))}">${escHtml(JSON.stringify(val).slice(0, 80))}</td>`;
      const s = String(val);
      return `<td title="${escHtml(s)}">${escHtml(s.slice(0, 120))}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `<table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;

  // Sort listeners
  wrap.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = 'asc'; }
      applyFilters();
      renderGrid();
    });
  });

  // Pagination
  pagination.innerHTML = `
    <span class="page-info">Page ${currentPage} of ${totalPages}</span>
    <button class="page-btn" id="pgFirst" ${currentPage===1?'disabled':''}>«</button>
    <button class="page-btn" id="pgPrev" ${currentPage===1?'disabled':''}>‹</button>
    <button class="page-btn" id="pgNext" ${currentPage===totalPages?'disabled':''}>›</button>
    <button class="page-btn" id="pgLast" ${currentPage===totalPages?'disabled':''}>»</button>
  `;
  document.getElementById('pgFirst').addEventListener('click', () => { currentPage = 1; renderGrid(); });
  document.getElementById('pgPrev').addEventListener('click', () => { currentPage--; renderGrid(); });
  document.getElementById('pgNext').addEventListener('click', () => { currentPage++; renderGrid(); });
  document.getElementById('pgLast').addEventListener('click', () => { currentPage = totalPages; renderGrid(); });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
